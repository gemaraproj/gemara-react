name: Deploy Astro Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gemara-react
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gemara-react
          persist-credentials: false

      - name: Read pinned spec version
        id: spec
        working-directory: gemara-react
        run: echo "ref=$(cat .spec-version)" >> "$GITHUB_OUTPUT"

      - name: Checkout gemara fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gemaraproj/gemara
          ref: ${{ steps.spec.outputs.ref }}
          path: gemara
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gemara-react/package-lock.json

      - name: Install package dependencies
        working-directory: gemara-react
        run: npm ci

      - name: Build package
        working-directory: gemara-react
        run: npm run build

      - name: Install Astro example dependencies
        working-directory: gemara-react/examples/astro
        run: npm ci

      - name: Build Astro example
        working-directory: gemara-react/examples/astro
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: gemara-react/examples/astro/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
